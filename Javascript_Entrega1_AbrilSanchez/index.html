<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proyecto Final - Carrito de Compras</title>
    <link rel="stylesheet" href="./css/estilos.css" />
  </head>
  <body>
    <header class="header">
      <h1>Carrito de compras</h1>
      <p class="sub">
        Simulador de compra. Podés agregar productos, editar cantidades,
        eliminar items y finalizar la compra.
      </p>
    </header>

    <main class="layout">
     
      <section class="col">
        <h2>Catálogo</h2>
        <div id="catalogo" class="catalogo"></div>
      </section>

      <section class="col">
        <h2>Carrito</h2>
        <div id="carrito" class="carrito"></div>
        <p id="total" class="total">Total: $0</p>

        <h2>Datos del comprador</h2>
        <form id="formCompra" class="form-compra">
          <div class="field">
            <label>Nombre</label>
            <input type="text" id="compradorNombre" placeholder="Tu nombre" />
          </div>
          <div class="field">
            <label>Email</label>
            <input type="email" id="compradorEmail" placeholder="ejemplo@mail.com" />
          </div>
          <div class="field">
            <label>Dirección</label>
            <input type="text" id="compradorDireccion" placeholder="Tu dirección" />
          </div>

          <button type="submit" class="btn-finalizar">Finalizar compra</button>
        </form>

        <div id="mensajeCompra" class="mensaje-compra"></div>
      </section>
    </main>

    <footer class="footer">
      <p>Proyecto Final - Sanchez</p>
    </footer>

    <script src="./js/app.js"></script>
  </body>
</html>
